<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animal artwork preview</title><link rel="icon" href="assets/pwa/island-icon-v3-192.png">
<link rel="stylesheet" href="ruby-shop.css?v=20261013-dragon1">
<style>
*{box-sizing:border-box}body{margin:0;background:#162b29;color:#f5ecd5;font:16px system-ui,sans-serif;padding:48px 28px;min-height:100vh}main{max-width:1240px;margin:auto}h1{font:clamp(32px,4vw,52px) Georgia,serif;margin:12px 0}p{color:#b9ccc2;line-height:1.6}.eyebrow{font-size:11px;letter-spacing:.24em;color:#d8b980}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin:32px 0}.animal-card{border:1px solid #577366;border-radius:22px;background:linear-gradient(145deg,#334a3b,#1b352d);padding:22px;overflow:hidden}.animal-art{height:310px;background:radial-gradient(ellipse at 50% 70%,#b2bb8740,transparent 65%);border-radius:18px}.animal-art svg.companion-illustration{width:100%;height:100%}.animal-card h2{font:26px Georgia,serif;margin:16px 0 8px}.animal-card p{font-size:13px;margin:0;min-height:42px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button{font:inherit;font-size:13px;border:1px solid #8ba68d;background:#e7dcc0;color:#253c32;border-radius:20px;padding:10px 16px;cursor:pointer}button:hover{background:#fff2d1}button:focus-visible{outline:3px solid #ffe09b;outline-offset:3px}.paused .companion-illustration *{animation-play-state:paused!important}.moving .companion-film{animation-duration:1.2s}.moving .care-paw-left{animation:preview-step .6s ease-in-out infinite}.moving .care-paw-right{animation:preview-step .6s ease-in-out -.3s infinite}.moving .companion-body{animation:preview-body .6s ease-in-out infinite}.moving [data-species=snail] .companion-body{animation:animal-breathe 1.4s ease-in-out infinite}@keyframes preview-step{50%{transform:translateY(-8px) rotate(5deg)}}@keyframes preview-body{50%{transform:translateY(-2px)}}@media(max-width:850px){.gallery{grid-template-columns:1fr}.animal-art{height:330px}body{padding:28px 16px}.animal-card p{min-height:0}}
</style>
</head>
<body><main><div class="eyebrow">COMPANION ARTWORK · LIVE PREVIEW</div><h1>A little closer to the wild.</h1><p>Natural proportions, detailed materials, and independently animated parts.</p><div class="gallery" id="gallery"></div></main>
<script src="companions.js?v=20261013-dragon1"></script>
<script>
const animals=[['fox','Red fox','A complete fox with natural head, ear, and tail motion.'],['dragon','Crystal dragon','A complete quadruped dragon with connected wings and tail.'],['snail','Crystal snail','A continuous muscular foot with a shell and moving feelers.']];
for(const [kind,name,description] of animals){const card=document.createElement('article');card.className='animal-card';card.innerHTML=`<div class="animal-art pet-play-art">${companionArt('pet:'+kind)}</div><h2>${name}</h2><p>${description}</p><div class="controls"><button data-action="motion" aria-pressed="false">Pause motion</button><button data-action="walk" aria-pressed="false">Animate</button><button data-action="pet">Head scratch</button></div>`;const art=card.querySelector('.animal-art');let timer;card.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.action==='motion'){const paused=card.classList.toggle('paused');button.textContent=paused?'Resume motion':'Pause motion';button.setAttribute('aria-pressed',paused);}if(button.dataset.action==='walk'){const moving=card.classList.toggle('moving');button.textContent=moving?'Idle stance':'Animate';button.setAttribute('aria-pressed',moving);}if(button.dataset.action==='pet'){clearTimeout(timer);art.dataset.mood='';void art.offsetWidth;art.dataset.mood='pet';timer=setTimeout(()=>delete art.dataset.mood,2800);}});if(kind==='fox'||kind==='dragon'){const link=document.createElement('a');link.href=kind+'-3d-preview.html';link.textContent='Try 3D '+kind;link.style.cssText='color:#ffe3a3;display:inline-block;margin-top:16px';card.append(link);}document.getElementById('gallery').append(card);}
</script></body></html>
