<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Creature Update — Player Guide</title><style>*{box-sizing:border-box}body{margin:0;background:#102d2d;color:#f9edcf;font:17px/1.65 system-ui,sans-serif}button,input{font:inherit}header{padding:24px clamp(18px,4vw,48px);border-bottom:1px solid #af925c;background:#173a38}header p{margin:0;color:#d0bf97}h1{font:normal clamp(26px,4vw,40px)/1.2 Georgia,serif;margin:0 0 8px}main{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1160px;margin:auto;min-height:75vh}aside{padding:24px 16px;border-right:1px solid #45605a}input{width:100%;padding:10px;border:1px solid #6b8174;border-radius:7px;background:#0e2627;color:#fff}nav{display:grid;gap:4px;margin-top:12px}button{cursor:pointer;border:1px solid #8d794f;border-radius:7px;padding:10px 14px;background:#214b47;color:#fff0cb}nav button{text-align:left;background:transparent;border-color:transparent}nav button[aria-current=page]{background:#dfc48b;color:#30281b}button:hover{filter:brightness(1.15)}button:focus-visible,input:focus-visible{outline:3px solid #efd07e;outline-offset:3px}article{margin:28px;padding:clamp(20px,4vw,44px);background:#f1dfb6;color:#342e22;border-radius:12px;box-shadow:0 10px 32px #0003}h2{font:normal clamp(26px,3vw,36px)/1.25 Georgia,serif;margin:8px 0 24px}h3{font-size:19px;margin:26px 0 6px}p{margin:12px 0}ul,ol{padding-left:24px}li{margin:8px 0}table{width:100%;border-collapse:collapse;margin:20px 0}td,th{text-align:left;padding:10px;border-bottom:1px solid #bca875}th{background:#e2cc9d}.eyebrow{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#685632}.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:32px;border-top:1px solid #bca875;padding-top:20px}.pager span{font-size:14px}button:disabled{opacity:.35;cursor:default}#empty{color:#d0bf97}footer{padding:20px;text-align:center;color:#d0bf97;font-size:13px}@media(max-width:700px){main{display:block}aside{border-right:0;border-bottom:1px solid #45605a;padding:16px}nav{display:flex;overflow-x:auto;padding-bottom:8px}nav button{white-space:nowrap;flex-shrink:0}article{margin:16px;padding:22px}td,th{padding:8px 5px;font-size:14px}header{padding:22px 18px}.pager button{padding:9px} }@media print{aside,.pager,input,footer{display:none}body{background:white;color:black}main{display:block}article{box-shadow:none;background:white;margin:0;page-break-after:always}}</style></head><body><header><h1>The Creature Update</h1><p>Player guide · Browse by topic</p></header><main><aside><label for="search">Find a topic</label><input id="search" type="search" placeholder="Try food, tokens, mines…"><nav aria-label="Guide chapters" id="contents"></nav><p id="empty" hidden>No matching chapters.</p></aside><article id="page" aria-live="polite"></article></main><footer>Keep this guide handy while exploring the update.</footer><script>const pages=[["Start here", "Your guide to the Creature Update", "<p>Your creatures now have individual homes, names and levels, and a bigger role in battle. Use the contents to jump to a topic, or read through with the page buttons.</p><h3>A good first visit</h3><ol><li>Visit the Stable, meet your residents and give them names.</li><li>Cook or buy food and feed a creature to raise its level.</li><li>Open Creature Brawl and choose three different creatures.</li><li>Check each creature’s abilities, then try a practice battle.</li><li>Look for Brawl tokens in packs to upgrade your team’s grades.</li></ol><p>Already know the basics? Choose any chapter from the contents. This guide covers the main changes since October 16.</p>"], ["Stables & residents", "A home for every creature", "<p>Each owned copy has its own place in the Stable. Two Rills are two separate residents, with their own names, feeding progress and levels.</p><h3>Make them yours</h3><p>Select a resident and use <strong>Edit name</strong> to give them a personal name. Leave the field blank to restore their original name. Automatic “#1” and “#2” labels have been removed.</p><h3>A more natural sanctuary</h3><p>The Stable has a woodland backdrop and species-specific platforms: a roost for Rill, sandy ground for Talren and Defender Talren, snow for Northern Talren, and homes suited to Veyrin, Krynn, Fenra, Velkris, Kanji and Trusk.</p><p>Creature sizes follow their intended height differences. Brawl brings those differences closer together to keep the lineups readable.</p><h3>Finding a resident</h3><p>Use search and sorting to find a creature, then select its portrait. The mobile layout leaves more space for the creature, and unnecessary information and rotation controls have been removed.</p><p>Dyes now create stronger, more distinguishable colours.</p>"], ["Food & creature levels", "Feed your creatures to help them grow", "<p>Every resident has an individual nutrition bar. Feeding fills it; filling the bar raises that creature’s level. Better food provides more nutrition, and excess nutrition carries towards the next level.</p><table><thead><tr><th>Food</th><th>Nutrition</th></tr></thead><tbody><tr><td>Regular meal</td><td>10</td></tr><tr><td>Trail mix</td><td>25</td></tr><tr><td>Feast</td><td>60</td></tr></tbody></table><h3>Where to get food</h3><p>Cook meals in the Farmhouse or buy available food from the market’s pet food stall using <strong>Footy</strong>, instead of rubies.</p><h3>If feeding is unavailable</h3><p>Check the amount owned beside the selected food. You need food in your inventory before you can feed a creature. Select another food if you have some of that instead.</p><h3>Levels and grades are different</h3><p>Food raises a creature’s level. Brawl tokens upgrade its battle grade. Higher creature levels unlock higher grade limits; see the next chapter.</p>"], ["Brawl grades & upgrades", "Turn tokens into stronger battle stats", "<p>Open a creature’s profile in the Brawl deck selector to see its grade, token balance and next upgrade. Green numbers beside its stats show the gains from the next grade.</p><table><thead><tr><th>Creature level</th><th>Maximum Brawl grade</th></tr></thead><tbody><tr><td>1–23</td><td>5</td></tr><tr><td>24–50</td><td>7</td></tr><tr><td>51 and above</td><td>10</td></tr></tbody></table><p>Reaching the required level unlocks the higher limit. You still need the tokens shown on the upgrade button.</p><h3>Where to upgrade</h3><p>Brawl grade upgrades belong in the Brawl profile. Feed your creature in the Stable, or use the feeding option from its Brawl profile.</p><h3>Duplicate residents in Brawl</h3><p>Team selection shows one representative of each creature variant: your strongest owned copy. Other residents remain in the Stable. You cannot fill a team with three copies of the same creature.</p>"], ["Playing Creature Brawl", "Build a team and choose your moves", "<p>Choose three different creatures in the deck selector and save your team. Each creature has three abilities with different roles and action point costs.</p><h3>Learn before you fight</h3><p>Open a creature’s profile for its portrait, rarity, class, level, grade and stats. Tap an ability to read what it does. During a battle, the little <strong>i</strong> opens the same style of profile for inspection.</p><h3>Practice or ranked?</h3><ul><li><strong>Practice:</strong> try creatures and abilities without permanent rewards.</li><li><strong>Ranked:</strong> win rating and move through the arenas. A win currently gives <strong>5 rubies</strong>, with no Footy or creature-token reward.</li></ul><p>Ranked wins add 20 rating; losses remove 10. The expanded Brawl reward system is planned for a later update.</p><h3>Leaving a battle</h3><p>Use the white flag to surrender. Leaving an unfinished ranked battle also counts as a loss.</p><h3>Arena presentation</h3><p>The battle arena now follows the ruined stone, banners, braziers and sunset setting of the lobby and loading art. Creature loading and movement have also received fixes.</p>"], ["Classes, rarity & opponents", "Every creature has its own strengths", "<p>Combat class helps define a creature’s role, but creatures of the same class no longer share identical base stats. Some Protectors hit harder; others have more health or defence.</p><p>Brugar and Brakk have particularly high base health. Look at each creature’s actual stats and abilities when building a team.</p><h3>Rarity matters, without enormous gaps</h3><p>Rarity adds a modest bonus to health, attack and defence:</p><table><thead><tr><th>Rarity</th><th>Bonus</th></tr></thead><tbody><tr><td>Common</td><td>—</td></tr><tr><td>Rare</td><td>4%</td></tr><tr><td>Epic</td><td>8%</td></tr><tr><td>Legendary</td><td>12%</td></tr><tr><td>Unique</td><td>16%</td></tr></tbody></table><h3>Different arenas, different teams</h3><p>Early arenas favour lower-rarity creatures. Higher arenas favour higher-rarity opponents. Enemy teams are varied rather than always using the same three creatures.</p><h3>Kael’s new role</h3><p>Kael is now Cunning. His kit includes Expose Guard and the shadow-based Nightfall, which attacks the enemy team and reduces attack and speed.</p>"], ["Buffs, debuffs & abilities", "Read the battle at a glance", "<p>Effect icons help you see what an ability applies and what is currently affecting a creature.</p><h3>Before using an ability</h3><p>Small icons on an ability card show its effects. When an ability has several effects, the icons stack vertically. Tap the ability for the full explanation.</p><h3>During battle</h3><p>Active effect icons sit above the creature’s nameplate so they do not cover the model. Additional icons extend to the left. Duration counters help show how long an effect remains.</p><h3>Recognising negative effects</h3><p>Attack, defence and speed reductions use broken versions of their positive symbols. The icons no longer rely on red or green backgrounds and up/down arrows.</p><p>Tap an effect for details. The effect guide in battle settings is useful when you meet an unfamiliar symbol.</p>"], ["Brawl tokens", "Collect tokens for the creatures you want to upgrade", "<p>Creature tokens come from packs, rather than being earned by playing matches with that creature.</p><h3>Separate tokens for each variant</h3><p>Variants have their own token balances. Kael and Tharos use different tokens, as do Rill and Aeri, Krynn and Virex, Fenra and Saelis, and Brugar and Brakk.</p><h3>Random rarity tokens</h3><p>A pack may offer a reward such as <strong>Common Brawl tokens</strong>. If that reward is drawn, the game picks an eligible creature of that rarity and gives you its tokens.</p><p>Within that rarity pool, creatures you own are slightly more likely to be selected. Creatures used in completed ranked battles can also receive a small preference. These are small adjustments to which creature is chosen, not an increase to the chance of drawing the token reward itself.</p><h3>Seeing your reward</h3><p>Token rewards show the creature portrait and updated token balance. Tokens for a creature you have not obtained appear subdued.</p><p>In pack odds, token options appear first, with creature-head previews for rarity pools.</p>"], ["Packs & Unique creatures", "Know what you can open and collect", "<h3>Unique means one of that creature</h3><p>Once you own a Unique creature, you cannot obtain another copy of that same creature from a pack. You can still obtain a different Unique creature, and tokens for your owned Unique creatures remain available.</p><p>An already-owned Unique creature is removed from your personal reward options. Its chance is split equally between the remaining eligible options on that reward card. This applies to daily packs too.</p><h3>A cleaner opening sequence</h3><p>Tap through the rewards with fewer labels and buttons covering the screen. The last card has a special slingshot exit. Amulet bonus rewards appear <strong>before the final card</strong>.</p><h3>Checking the odds</h3><p>Pack previews start on the actual last card, even when the pack has more or fewer than five cards. Check each reward card’s odds to see its possible rewards.</p><h3>Shop cooldowns</h3><p>Some shop packs have their own purchase cooldowns. Look for the timer before buying again. Daily pack unlock times display hours and minutes.</p>"], ["Inventory & clothing", "Find what you own", "<h3>Hide duplicate cards</h3><p>Use <strong>Hide duplicates</strong> to browse one copy of each card in your inventory. This only changes the view; it does not remove your extra copies.</p><h3>Two ways to count your collection</h3><ul><li><strong>Total cards:</strong> includes duplicate copies.</li><li><strong>Collection progress:</strong> distinct cards collected out of the total available.</li></ul><h3>Clothing rarity rewards</h3><p>Clothing and accessories have been organised into rarity tiers based on their designs. Packs can now contain a reward such as Common clothing or Epic clothing, which chooses an item from that tier.</p><p>Clothing rewards can appear in regular and daily packs. Duplicate clothing can still be drawn.</p><h3>Picking a deck</h3><p>Card Brawl remembers your last-used deck as the default, rather than always selecting the lowest deck.</p>"], ["Town Halls & ruby mines", "Grow your island with easier early progression", "<h3>Town Hall progression</h3><p>XP thresholds have been lowered, especially early on. You keep your existing XP, so you may already be closer to the next level or have reached a higher Town Hall.</p><p>The early progression target is roughly a month and a half to Town Hall 6 with regular daily play. Your pace depends on which activities you complete; later levels slow down more gradually.</p><h3>Ruby mine upgrades</h3><table><thead><tr><th>Mine level</th><th>Capacity</th><th>Workers</th><th>Upgrade</th></tr></thead><tbody><tr><td>1</td><td>20 rubies</td><td>3</td><td>Starting mine</td></tr><tr><td>2</td><td>25 rubies</td><td>12</td><td>TH 7 · 600 rubies</td></tr><tr><td>3</td><td>35 rubies</td><td>15</td><td>TH 9 · 800 rubies</td></tr></tbody></table><p>Upgrade controls appear when the required Town Hall level is reached. Remember to leave enough villagers available for an upgraded mine.</p><h3>Crystal refinery</h3><p>Reaching Town Hall 5 starts a newly unlocked refinery at its first level, rather than automatically fully upgrading it.</p>"], ["Farmhouse & time skips", "Spend less time in menus", "<h3>Gather directly from ingredient rows</h3><p>The Farmhouse now puts collecting and sending or calling back beside each ingredient. Collect buttons use the ingredient pictograms, and the action changes with the current gathering stage.</p><table><thead><tr><th>Ingredient</th><th>Villagers needed</th></tr></thead><tbody><tr><td>Water</td><td>2</td></tr><tr><td>Carrots</td><td>3</td></tr><tr><td>Corn</td><td>4</td></tr><tr><td>Milk</td><td>5</td></tr><tr><td>Meat</td><td>6</td></tr></tbody></table><h3>Skip time where you need it</h3><p>Timed buildings have a <strong>Time skip</strong> option, so you can manage their timers directly instead of always going through the Time Bank.</p><p>Choose Time Skips or Time Leaps, adjust the quantity, and check the preview before using them. The finish option helps choose enough to complete the timer.</p><p>Boosts also support newer timers, including pack cooldowns. Check the displayed duration because amulets can improve a boost’s effect.</p>"], ["Amulets & finishing touches", "More useful bonuses and smoother play", "<h3>Stacking effects</h3><p>Amulet effects now stack. The exception is percentage price discounts: when several apply, the strongest discount counts.</p><p>Bonuses have been extended to newer features and timers. Pack-opening Footy bonuses also apply to daily packs, and bonus rewards are revealed before the final pack card.</p><h3>More variety</h3><p>Repeated amulet designs have been replaced with a more varied selection across the tiers. Check your amulets’ descriptions to see their current effects.</p><h3>Wheel of Fortune</h3><p>After a spin, the centre shows your reward, including VIP doubling where applicable. Extra Footy from bonuses is shown alongside it.</p><h3>Presentation and fixes</h3><p>The update also includes creature-focused loading art, a Kael app icon, mobile layout improvements, clearer island water blending, and fixes for building clicks, unresponsive navigation, moving island residents and pet walking direction.</p><p>Battle animations and creature loading have received fixes and focused animation work. Further improvements will continue.</p>"]];let current=0;const contents=document.getElementById('contents'),page=document.getElementById('page'),search=document.getElementById('search');function menu(){const q=search.value.toLowerCase().trim();contents.replaceChildren();pages.forEach((p,i)=>{if(q&&!p.join(' ').replace(/<[^>]*>/g,' ').toLowerCase().includes(q))return;const b=document.createElement('button');b.textContent=(i+1)+'. '+p[0];b.setAttribute('aria-current',i===current?'page':'false');b.onclick=()=>show(i,true);contents.append(b)});document.getElementById('empty').hidden=contents.children.length>0}function show(i,scroll){current=Math.max(0,Math.min(pages.length-1,i));const p=pages[current];page.innerHTML='<div class="eyebrow">Chapter '+(current+1)+' · '+p[0]+'</div><h2>'+p[1]+'</h2>'+p[2]+'<div class="pager"><button id="prev" '+(current===0?'disabled':'')+'>← Previous</button><span>'+(current+1)+' / '+pages.length+'</span><button id="next" '+(current===pages.length-1?'disabled':'')+'>Next →</button></div>';document.getElementById('prev').onclick=()=>show(current-1,true);document.getElementById('next').onclick=()=>show(current+1,true);history.replaceState(null,'','#chapter-'+(current+1));menu();if(scroll)page.scrollIntoView({behavior:'smooth',block:'start'})}search.oninput=menu;const initial=/^#chapter-(\d+)$/.exec(location.hash);show(initial?Number(initial[1])-1:0,false);</script></body></html>
